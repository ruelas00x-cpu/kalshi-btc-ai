services:
  - type: web
    name: kalshi-btc-training-research
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: btc-research-storage
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: KALSHI_SERIES
        value: KXBTC15M
      - key: ENABLE_RESEARCH_POLLER
        value: 'true'
      - key: AUTO_TRAIN_CANDIDATE
        value: 'true'
